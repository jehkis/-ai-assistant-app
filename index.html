<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Assistant — Home</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="AI Assistant prototype — mock UI for chat, settings and content pages">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">AI Assistant</a>
      <nav class="main-nav" aria-label="Päävalikko">
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button class="menu-toggle" aria-expanded="false" aria-label="Toggle menu">☰</button>
    </div>
  </header>

  <main class="container grid-root">
    <aside class="sidebar">
      <h3>Asetukset</h3>
      <div class="control-head">
        <label for="temp">Temperature</label>
        <output id="tempOut" for="temp">0.7</output>
      </div>
      <input id="temp" type="range" min="0" max="1" step="0.01" value="0.7" oninput="tempOut.value = this.value">
      <label>Model
        <select>
          <option>mock-model-v1</option>
          <option>mock-model-v2</option>
        </select>
      </label>
      <button class="btn ghost">Reset Chat</button>
    </aside>

    <section class="chat-area">
      <div class="chat-header">
        <h2>Assistant</h2>
        <p class="muted">Mock chat UI — käytä tätä esitykseen</p>
      </div>

      <ul class="chat-history" aria-live="polite">
        <li class="msg user"><strong>You:</strong> Hei, mitä voit tehdä?</li>
        <li class="msg bot"><strong>Assistant:</strong> Voin auttaa koodissa, suunnittelussa ja muussa.</li>
      </ul>

      <form class="chat-input" onsubmit="event.preventDefault(); addMessage();">
        <textarea id="prompt" placeholder="Kirjoita viesti..." rows="2"></textarea>
        <div class="input-actions">
          <button type="submit" class="btn primary">Send</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 Joona — AI Assistant prototype</div>
  </footer>

  <script>
    function addMessage(){
      const t = document.getElementById('prompt');
      if(!t.value.trim()) return;
      const ul = document.querySelector('.chat-history');
      const li = document.createElement('li'); li.className='msg user'; li.innerHTML = '<strong>You:</strong> '+escapeHtml(t.value);
      ul.appendChild(li); t.value=''; ul.scrollTop = ul.scrollHeight;
      // mock assistant reply
      setTimeout(()=>{ const r = document.createElement('li'); r.className='msg bot'; r.innerHTML = '<strong>Assistant:</strong> Tämä on mock-vastaus.'; ul.appendChild(r); ul.scrollTop = ul.scrollHeight },700);
    }
    function escapeHtml(s){ return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }
    // simple mobile menu
    const btn = document.querySelector('.menu-toggle'); const nav = document.querySelector('.main-nav'); btn.addEventListener('click', ()=>{ const open = nav.classList.toggle('open'); btn.setAttribute('aria-expanded', open); });
  </script>
</body>
</html>
