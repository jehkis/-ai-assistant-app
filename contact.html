<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Assistant — Yhteystieto</title>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js?v=20260511-4" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">AI Assistant</a>
      <nav class="main-nav" aria-label="Päävalikko">
        <a href="index.html">Koti</a>
        <a href="about.html">Tietoja</a>
        <a href="projects.html">Projektit</a>
        <a href="contact.html" class="active">Yhteystieto</a>
      </nav>
      <button class="menu-toggle" aria-expanded="false" aria-label="Toggle menu">☰</button>
    </div>
  </header>

  <main class="container page-content">
    <h1>Ota yhteyttä</h1>
    <form class="contact-form" action="#" method="post">
      <label>Nimi <input type="text" name="name" autocomplete="name" required></label>
      <label>Sähköposti <input type="email" name="email" autocomplete="email" required></label>
      <label>Viesti <textarea name="message" rows="4" autocomplete="off" required></textarea></label>
      <button class="btn primary" type="submit">Lähetä</button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer"><div class="container">© 2026 Joona</div></footer>
</body>
</html>
